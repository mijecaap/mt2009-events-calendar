<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Eventos MT2009 — Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f6f1;--panel:#fff;--ink:#191817;--mut:#716f68;--line:#e6e4dc;--sel:#191817;--live:#2f8f5b}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:940px;margin:0 auto;padding:26px 20px 64px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding-bottom:16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
h1{font-family:Newsreader,Georgia,serif;font-weight:500;font-size:26px;letter-spacing:-.3px;margin:0}
h1 span{color:var(--mut);font-size:14px;font-family:Inter;font-weight:400;margin-left:8px}
.tz{display:flex;gap:2px;background:#efece4;border:1px solid var(--line);border-radius:8px;padding:2px}
.tz button{border:0;background:none;font:inherit;font-size:12.5px;color:var(--mut);padding:5px 11px;border-radius:6px;cursor:pointer}
.tz button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.07)}
.grid{display:grid;grid-template-columns:224px 1fr;gap:36px;margin-top:26px}
@media(max-width:720px){.grid{grid-template-columns:1fr;gap:22px}}
.mhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.mhead h2{font-size:13px;font-weight:600;text-transform:capitalize;margin:0}
.mnav button{border:1px solid var(--line);background:#fff;width:26px;height:26px;border-radius:6px;cursor:pointer;color:var(--mut)}
.dow,.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.dow span{text-align:center;font-size:10.5px;color:var(--mut);font-weight:500;padding:4px 0}
.cell{aspect-ratio:1;border:0;background:none;border-radius:7px;cursor:pointer;color:var(--ink);font:inherit;font-size:12.5px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.cell.out{color:#c8c6bd}
.cell:hover{background:#efece4}
.cell.today{font-weight:700}
.cell.sel{background:var(--sel);color:#fff}
.dots{display:flex;gap:2px;height:5px}
.dots i{width:4px;height:4px;border-radius:50%}
.dayhead{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
.dayhead h2{font-family:Newsreader,serif;font-weight:500;font-size:22px;margin:0;text-transform:capitalize}
.dayhead .meta{color:var(--mut);font-size:13px}
.next{font-size:13px;color:var(--mut);margin:2px 0 14px}
.next b{color:var(--ink);font-weight:600}
.slot{margin:16px 0 4px;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--mut);font-weight:600}
.ev{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.ev:last-child{border-bottom:0}
.t{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--mut);min-width:92px}
.bar{width:3px;height:20px;border-radius:2px;flex:none}
.nm{font-weight:500;flex:1;min-width:0}
.badge{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;font-family:'JetBrains Mono',monospace}
.live{font-size:10px;font-weight:700;letter-spacing:.07em;color:var(--live);text-transform:uppercase}
.empty{color:var(--mut);padding:22px 0}
.foot{margin-top:44px;color:var(--mut);font-size:12px}
</style>
</head>
<body>
<div class="wrap">
 <header>
  <h1>Eventos <span>MT2009 · calendario</span></h1>
  <div class="tz" id="tz"><button data-tz="America/Lima" class="on">Lima</button><button data-tz="Etc/GMT-3">Servidor</button></div>
 </header>
 <div class="grid">
  <aside>
   <div class="mhead"><h2 id="mlabel">…</h2><div class="mnav"><button id="prev">‹</button> <button id="nextm">›</button></div></div>
   <div class="dow"><span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span><span>D</span></div>
   <div class="cal" id="cal"></div>
  </aside>
  <section>
   <div class="dayhead"><h2 id="dlabel">…</h2><span class="meta" id="dmeta"></span></div>
   <div class="next" id="next"></div>
   <div id="list"></div>
  </section>
 </div>
 <div class="foot" id="foot"></div>
</div>
<script>
const API='https://mt2009.uk/api/events/list';
const TYPE={EVENT_TYPE_MOONLIGHT:['Luz de Luna','#b78bf5'],EVENT_TYPE_WHEEL_FORTUNE_EVENT:['Rueda de la Fortuna','#ef7fd0'],EVENT_TYPE_DOUBLE_METIN_LOOT_EVENT:['Doble Loot Metin','#ef6b6b'],EVENT_TYPE_DOUBLE_BOSS_LOOT_EVENT:['Doble Loot Boss','#f0913f'],EVENT_TYPE_DOUBLE_FISHING:['Pesca Doble','#3fb6e6'],EVENT_TYPE_DOUBLE_MINING:['Minería Doble','#9aa6b8'],EVENT_TYPE_EXP:['EXP','#43c96b'],EVENT_TYPE_ITEM_DROP:['Item Drop','#e0b83f'],EVENT_TYPE_YANG_DROP:['Yang Drop','#d9a520'],EVENT_TYPE_BONUS_EVENT:['Bonus','#d17ff0'],EVENT_TYPE_TANAKA:['Tanaka','#ef6d86'],EVENT_TYPE_METIN_RAIN:['Metin Rain','#4f8fe8']};
const meta=id=>TYPE[id]?{name:TYPE[id][0],color:TYPE[id][1]}:{name:id.replace('EVENT_TYPE_','').replace(/_/g,' ').toLowerCase(),color:'#7a8496'};
function inten(e){const id=e.eventIndex,v0=e.value0||0,v1=e.value1||0,v3=e.value3||0;
 if(id==='EVENT_TYPE_EXP'||id==='EVENT_TYPE_ITEM_DROP'||id==='EVENT_TYPE_YANG_DROP')return v0?'+'+v0+'%':'';
 if(id==='EVENT_TYPE_MOONLIGHT'||id==='EVENT_TYPE_WHEEL_FORTUNE_EVENT')return v3?v3+'%'+(v3>=2?' ★':''):'';
 if(id==='EVENT_TYPE_DOUBLE_METIN_LOOT_EVENT'||id==='EVENT_TYPE_DOUBLE_BOSS_LOOT_EVENT')return v3?'+'+v3+'%':'';
 if(id==='EVENT_TYPE_DOUBLE_FISHING'||id==='EVENT_TYPE_DOUBLE_MINING')return 'x2';
 if(id==='EVENT_TYPE_BONUS_EVENT')return v1?'+'+v1:'';return '';}
function off(d,tz){const p={};for(const x of new Intl.DateTimeFormat('en-US',{timeZone:tz,hour12:false,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'}).formatToParts(d))p[x.type]=x.value;return Date.UTC(+p.year,+p.month-1,+p.day,+p.hour,+p.minute,+p.second)-d.getTime();}
function z2u(y2,tz){const[Y,M,D]=y2.split('-').map(Number);const t0=Date.UTC(Y,M-1,D,0,0,0);const o1=off(new Date(t0),tz);let c=t0-o1;const o2=off(new Date(c),tz);if(o2!==o1)c=t0-o2;return c;}
function ymd(d,tz){return new Intl.DateTimeFormat('en-CA',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit'}).format(d);}
function hm(d,tz){return new Intl.DateTimeFormat('en-GB',{timeZone:tz,hour:'2-digit',minute:'2-digit',hour12:false}).format(d);}
function addD(y2,n){const d=new Date(y2+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);}
function P(e){return{start:Date.parse(e.startTime),end:Date.parse(e.endTime)};}
function dayEvents(evs,day,tz){const a=z2u(day,tz),b=z2u(addD(day,1),tz);return evs.filter(e=>e.enabled!==false&&P(e).end>a&&P(e).start<b).sort((x,y)=>P(x).start-P(y).start);}
function group(evs,tz){const m=new Map();for(const e of evs){const s=P(e).start,en=P(e).end;const k=hm(new Date(s),tz)+'–'+hm(new Date(en),tz);if(!m.has(k))m.set(k,{slot:k,start:s,items:[]});m.get(k).items.push(e);}return[...m.values()].sort((a,b)=>a.start-b.start);}
async function load(){const r=await fetch(API);return(await r.json()).data.filter(e=>e.enabled!==false);}

const $=s=>document.querySelector(s);
let EV=[],tz='America/Lima',sel=null,y,m;
const types=()=>[...new Set(EV.map(e=>e.eventIndex))];
function renderAll(){renderCal();renderDay();$('#foot').textContent='Fuente mt2009.uk · actualizado '+hm(new Date(),tz);}
function renderCal(){
 $('#mlabel').textContent=new Date(Date.UTC(y,m-1,1)).toLocaleDateString('es-PE',{month:'long',year:'numeric',timeZone:'UTC'});
 const first=new Date(Date.UTC(y,m-1,1)),dowMon=(first.getUTCDay()+6)%7,cal=$('#cal'),t=ymd(new Date(),tz);cal.innerHTML='';
 for(let i=0;i<42;i++){const cur=new Date(Date.UTC(y,m-1,1-dowMon+i)),key=cur.toISOString().slice(0,10);
  const inM=key.slice(0,7)===y+'-'+String(m).padStart(2,'0');
  const evs=dayEvents(EV,key,tz);
  const b=document.createElement('button');b.className='cell'+(inM?'':' out')+(key===t?' today':'')+(key===sel?' sel':'');
  b.innerHTML='<span>'+cur.getUTCDate()+'</span><span class="dots">'+[...new Set(evs.map(e=>e.eventIndex))].slice(0,4).map(id=>'<i style="background:'+meta(id).color+'"></i>').join('')+'</span>';
  b.onclick=()=>{sel=key;renderCal();renderDay();};cal.appendChild(b);}
}
function renderDay(){
 $('#dlabel').textContent=new Date(sel+'T12:00:00Z').toLocaleDateString('es-PE',{weekday:'long',day:'numeric',month:'long',timeZone:'UTC'});
 const now=new Date(),evs=dayEvents(EV,sel,tz);
 $('#dmeta').textContent=evs.length?evs.length+' eventos':'sin eventos';
 const up=EV.filter(e=>P(e).start>now).sort((a,b)=>P(a).start-P(b).start)[0];
 $('#next').innerHTML=up?'Próximo: <b>'+meta(up.eventIndex).name+'</b> · '+hm(new Date(P(up).start),tz):'';
 const list=$('#list');list.innerHTML='';
 if(!evs.length){list.innerHTML='<div class="empty">Sin eventos este día.</div>';return;}
 for(const g of group(evs,tz)){
  list.insertAdjacentHTML('beforeend','<div class="slot">'+g.slot+'</div>');
  for(const e of g.items){const mm=meta(e.eventIndex),bd=inten(e),live=now>=new Date(P(e).start)&&now<=new Date(P(e).end);
   list.insertAdjacentHTML('beforeend','<div class="ev"><span class="t">'+hm(new Date(P(e).start),tz)+'–'+hm(new Date(P(e).end),tz)+'</span><span class="bar" style="background:'+mm.color+'"></span><span class="nm">'+mm.name+(live?' <span class="live">• en vivo</span>':'')+'</span>'+(bd?'<span class="badge" style="background:'+mm.color+'1f;color:'+mm.color+'">'+bd+'</span>':'')+'</div>');}
 }
}
$('#prev').onclick=()=>{m--;if(m<1){m=12;y--;}renderCal();};
$('#nextm').onclick=()=>{m++;if(m>12){m=1;y++;}renderCal();};
document.querySelectorAll('#tz button').forEach(b=>b.onclick=()=>{tz=b.dataset.tz;document.querySelectorAll('#tz button').forEach(x=>x.classList.toggle('on',x===b));renderAll();});
(async()=>{EV=await load();const d=new Date();y=d.getFullYear();m=d.getMonth()+1;sel=ymd(d,tz);renderAll();})();
</script>
</body>
</html>
