<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Propuesta A — Franja</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f6f1;--ink:#191817;--mut:#716f68;--line:#e6e4dc;--gold:#c8963e;--live:#2f8f5b}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding:22px 18px 60px}
.tag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#b6482b;margin-bottom:2px}
h1{font-family:Newsreader,Georgia,serif;font-weight:500;font-size:22px;margin:0}
h1 span{color:var(--mut);font-size:13px;font-family:Inter}
.mono{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums}
.dayh{display:flex;align-items:baseline;gap:10px;margin:18px 0 6px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.dayh h2{font-family:Newsreader,Georgia,serif;font-weight:500;font-size:20px;margin:0;text-transform:capitalize}
.dayh .meta{color:var(--mut);font-size:13px}
.franja{display:flex;align-items:baseline;gap:8px;margin:18px 0 4px}
.franja .a{font-size:16px;font-weight:600}
.franja .arw{color:var(--mut);font-size:13px}
.franja .b{font-size:13px;color:var(--mut)}
.franja .pill{margin-left:auto;font-size:10.5px;color:var(--mut);border:1px solid var(--line);border-radius:999px;padding:1px 8px}
.ev{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.ev:last-child{border-bottom:0}
.bar{width:3px;height:22px;border-radius:2px;flex:none}
.nm{flex:1;min-width:0;font-weight:500}
.hstar{color:var(--gold);font-size:11px}
.live{font-size:10px;font-weight:700;letter-spacing:.07em;color:var(--live);text-transform:uppercase}
.bdg{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:600;padding:3px 10px;border-radius:8px;letter-spacing:.01em;white-space:nowrap}
.note{margin-top:22px;font-size:12px;color:var(--mut);line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
 <span class="tag">Propuesta A · Franja</span>
 <h1>Eventos MT2009 <span id="tzname">…</span></h1>
 <div class="dayh"><h2 id="dlabel">…</h2><span class="meta" id="dmeta"></span></div>
 <div id="list"></div>
 <div class="note"><b>Qué cambia:</b> la hora se muestra <b>una sola vez</b> por franja (cabecera), las filas ya no la repiten. El badge sube de tamaño y pasa a <b>texto oscuro sobre el color del evento</b> (máximo contraste).</div>
</div>
<script>
const API="/api/events/list", FB="https://mt2009.uk/api/events/list";
const TYPE={EVENT_TYPE_MOONLIGHT:['Luz de Luna','#b78bf5'],EVENT_TYPE_WHEEL_FORTUNE_EVENT:['Rueda de la Fortuna','#ef7fd0'],EVENT_TYPE_DOUBLE_METIN_LOOT_EVENT:['Doble Loot Metin','#ef6b6b'],EVENT_TYPE_DOUBLE_BOSS_LOOT_EVENT:['Doble Loot Boss','#f0913f'],EVENT_TYPE_DOUBLE_FISHING:['Pesca Doble','#3fb6e6'],EVENT_TYPE_DOUBLE_MINING:['Minería Doble','#9aa6b8'],EVENT_TYPE_EXP:['EXP','#43c96b'],EVENT_TYPE_ITEM_DROP:['Item Drop','#e0b83f'],EVENT_TYPE_YANG_DROP:['Yang Drop','#d9a520'],EVENT_TYPE_BONUS_EVENT:['Bonus','#d17ff0'],EVENT_TYPE_TANAKA:['Tanaka','#ef6d86'],EVENT_TYPE_METIN_RAIN:['Metin Rain','#4f8fe8']};
const meta=id=>{const x=TYPE[id];return x?{name:x[0],c:x[1]}:{name:id.replace('EVENT_TYPE_','').replace(/_/g,' ').toLowerCase(),c:'#7a8496'};};
function inten(e){const id=e.eventIndex,v0=e.value0||0,v1=e.value1||0,v3=e.value3||0;
 if(id==='EVENT_TYPE_EXP'||id==='EVENT_TYPE_ITEM_DROP'||id==='EVENT_TYPE_YANG_DROP')return v0?'+'+v0+'%':'';
 if(id==='EVENT_TYPE_MOONLIGHT'||id==='EVENT_TYPE_WHEEL_FORTUNE_EVENT')return v3?v3+'%':'';
 if(id==='EVENT_TYPE_DOUBLE_METIN_LOOT_EVENT'||id==='EVENT_TYPE_DOUBLE_BOSS_LOOT_EVENT')return v3?'+'+v3+'%':'';
 if(id==='EVENT_TYPE_DOUBLE_FISHING'||id==='EVENT_TYPE_DOUBLE_MINING')return 'x2';
 if(id==='EVENT_TYPE_BONUS_EVENT')return v1?'+'+v1:'';return '';}
const isHi=e=>e.eventIndex==='EVENT_TYPE_DOUBLE_FISHING'||((e.eventIndex==='EVENT_TYPE_MOONLIGHT'||e.eventIndex==='EVENT_TYPE_WHEEL_FORTUNE_EVENT')&&(e.value3||0)>=2);
function off(d,tz){const p={};for(const x of new Intl.DateTimeFormat('en-US',{timeZone:tz,hour12:false,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'}).formatToParts(d))p[x.type]=x.value;return Date.UTC(+p.year,+p.month-1,+p.day,+p.hour,+p.minute,+p.second)-d.getTime();}
function z2u(y,tz){const[Y,M,D]=y.split('-').map(Number);const t0=Date.UTC(Y,M-1,D,0,0,0);const o1=off(new Date(t0),tz);let c=t0-o1;const o2=off(new Date(c),tz);if(o2!==o1)c=t0-o2;return c;}
function ymd(d,tz){return new Intl.DateTimeFormat('en-CA',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit'}).format(d);}
function hm(d,tz){return new Intl.DateTimeFormat('en-GB',{timeZone:tz,hour:'2-digit',minute:'2-digit',hour12:false}).format(d);}
function addD(y,n){const d=new Date(y+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);}
function P(e){return{s:Date.parse(e.startTime),e:Date.parse(e.endTime)};}
function dayEvents(evs,day,tz){const a=z2u(day,tz),b=z2u(addD(day,1),tz);return evs.filter(e=>e.enabled!==false&&P(e).e>a&&P(e).s<b).sort((x,y)=>P(x).s-P(y).s);}
function group(evs,tz){const m=new Map();for(const e of evs){const s=P(e).s,en=P(e).e;const k=s+'|'+en;if(!m.has(k))m.set(k,{s,en,items:[]});m.get(k).items.push(e);}return[...m.values()].sort((a,b)=>a.s-b.s);}
async function load(){for(const u of [API,FB]){try{const r=await fetch(u);if(!r.ok)continue;const j=await r.json();if(Array.isArray(j.data))return j.data.filter(e=>e.enabled!==false);}catch(e){}}return[];}
const tzName=z=>{try{return z.split('/').pop().replace(/_/g,' ');}catch{return z;}};

(async()=>{
  const tz=Intl.DateTimeFormat().resolvedOptions().timeZone||'America/Lima';
  document.getElementById('tzname').textContent='· '+tzName(tz);
  const EV=await load();
  const day=ymd(new Date(),tz);
  document.getElementById('dlabel').textContent=new Date(day+'T12:00:00Z').toLocaleDateString('es-PE',{weekday:'long',day:'numeric',month:'long',timeZone:'UTC'});
  const evs=dayEvents(EV,day,tz);
  document.getElementById('dmeta').textContent=evs.length?evs.length+' eventos':'sin eventos';
  const now=new Date(),list=document.getElementById('list');
  for(const g of group(evs,tz)){
    const last=now>=new Date(g.s);
    list.insertAdjacentHTML('beforeend',
      `<div class="franja"><span class="a mono">${hm(new Date(g.s),tz)}</span><span class="arw">→</span><span class="b mono">${hm(new Date(g.en),tz)}</span>${last?'<span class="pill">en curso</span>':''}</div>`);
    for(const e of g.items){
      const m=meta(e.eventIndex),b=inten(e),hi=isHi(e),live=now>=new Date(P(e).s)&&now<=new Date(P(e).e);
      list.insertAdjacentHTML('beforeend',
        `<div class="ev"><span class="bar" style="background:${m.c}"></span><span class="nm">${hi?'<span class="hstar">★</span> ':''}${m.name}${live?' <span class="live">• en vivo</span>':''}</span>${b?`<span class="bdg" style="background:${m.c}2e;color:#191817;border:1px solid ${m.c}66">${b}</span>`:''}</div>`);
    }
  }
})();
</script>
</body>
</html>
