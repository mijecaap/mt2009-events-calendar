<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f17" />
  <meta name="description" content="Calendario de eventos de Metin2 en MT2009 (mt2009.uk), en hora de Lima." />
  <title>Eventos Metin2 · MT2009</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗡️</text></svg>" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">🗡️</span>
      <div>
        <h1>Eventos MT2009</h1>
        <p class="sub" id="subtitle">Cargando…</p>
      </div>
    </div>
    <div class="controls">
      <div class="tz" role="group" aria-label="Zona horaria">
        <button type="button" data-tz="America/Lima" class="active">🇵🇪 Lima</button>
        <button type="button" data-tz="Etc/GMT-3">🌐 Servidor</button>
      </div>
      <button type="button" id="refresh" class="ghost" title="Refrescar" aria-label="Refrescar">⟳</button>
    </div>
  </header>

  <main class="layout">
    <section class="card calendar" aria-label="Calendario">
      <div class="cal-head">
        <button type="button" id="prev" class="ghost" aria-label="Mes anterior">‹</button>
        <h2 id="month-label">—</h2>
        <button type="button" id="next" class="ghost" aria-label="Mes siguiente">›</button>
      </div>
      <div class="dow" aria-hidden="true">
        <span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span><span>D</span>
      </div>
      <div id="grid" class="grid"></div>
      <div id="legend" class="legend"></div>
    </section>

    <section class="card day" aria-label="Eventos del día">
      <div id="next-event" class="next"></div>
      <h2 id="day-label">—</h2>
      <div id="filters" class="filters"></div>
      <div id="day-events" class="day-events"></div>
    </section>
  </main>

  <footer class="foot">
    Datos: <a href="https://mt2009.uk" target="_blank" rel="noopener">mt2009.uk</a>
    · <span id="updated">—</span>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
