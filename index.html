<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f6f1">
<meta name="description" content="Calendario de eventos de Metin2 en MT2009 (mt2009.uk), en tu hora local.">
<title>Eventos MT2009</title>
<script>(function(){try{var t=localStorage.getItem('mtevents-theme');if(t!=='light'&&t!=='dark'){t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';}document.documentElement.setAttribute('data-theme',t);var m=document.querySelector('meta[name=theme-color]');if(m)m.content=(t==='dark'?'#141310':'#f7f6f1');}catch(e){}})();</script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%23b6482b'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=9">
</head>
<body>
<div class="wrap">
 <header>
  <h1>Eventos <span>MT2009 · calendario</span></h1>
  <div class="hctl">
   <div class="tzx" id="tzx" title="Zona horaria detectada automáticamente de tu dispositivo">Hora local · <b id="tzname">—</b></div>
   <button id="theme" class="icbtn" type="button" aria-label="Cambiar tema claro u oscuro" title="Modo claro / oscuro">
     <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
     <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
   </button>
  </div>
 </header>
 <div class="grid">
  <aside>
   <div class="mhead"><h2 id="mlabel">…</h2><div class="mnav"><button id="prev" aria-label="Mes anterior">‹</button> <button id="nextm" aria-label="Mes siguiente">›</button></div></div>
   <div class="dow"><span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span><span>D</span></div>
   <div class="cal" id="cal"></div>
   <div class="cal-legend"><span class="s">★</span><span>Día destacado: doble pesca, o Luz de Luna / Ruleta al 2% o más</span></div>
  </aside>
  <section>
   <div class="dayhead"><h2 id="dlabel">…</h2><span class="meta" id="dmeta"></span></div>
   <div class="next" id="next"></div>
   <div id="list"></div>
  </section>
 </div>
 <div class="foot" id="foot"></div>
</div>
<script type="module" src="app.js?v=9"></script>
</body>
</html>
