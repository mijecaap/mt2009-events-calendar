server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Sin caché de HTML/JS/CSS: evita servir index.html y app.js de versiones distintas.
    add_header Cache-Control "no-cache" always;

    # API de eventos proxeada same-origin (evita CORS / bloqueos de WebView).
    location /api/ {
        proxy_pass https://mt2009.uk/api/;
        proxy_set_header Host mt2009.uk;
        proxy_set_header User-Agent "hermes-events/1.0";
        proxy_set_header Accept "application/json";
        proxy_ssl_server_name on;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
